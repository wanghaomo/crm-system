server {
    listen       8210;
    server_name  14.103.132.205;


   client_max_body_size 2048M;
    # 静态文件根目录（对应Docker中复制的dist目录）
    root   /usr/share/nginx/html;
    index  index.html index.htm;

    # 日志配置（可选）
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    # ================== 缓存治理：入口 HTML 永不缓存 ==================
    # 主应用和飞书 WebView 必须每次拿到最新入口，避免继续引用旧 hash 资源。
    location ~* \.html$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        add_header 'Access-Control-Allow-Origin' 'http://smart-platform.mxnaturalres.com:9400' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Authorization' always;

        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' 'http://smart-platform.mxnaturalres.com:9400' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Authorization' always;
            add_header 'Access-Control-Max-Age' '86400' always;
            add_header 'Content-Length' '0' always;
            return 204;
        }

        try_files $uri $uri/ /index.html;
    }

    # ================== 缓存治理：版本文件永不缓存 ==================
    # 主应用 entry 拼接和子应用 mount 自检都依赖该文件。
    location = /version.json {
        add_header Cache-Control "no-cache, no-store, must-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        add_header Content-Type "application/json; charset=utf-8" always;
        add_header 'Access-Control-Allow-Origin' 'http://smart-platform.mxnaturalres.com:9400' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Authorization' always;

        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' 'http://smart-platform.mxnaturalres.com:9400' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Authorization' always;
            add_header 'Access-Control-Max-Age' '86400' always;
            add_header 'Content-Length' '0' always;
            return 204;
        }

        try_files $uri =404;
    }

    # 处理Vue路由history模式
    location / {
        # ===== 修复：显式处理 OPTIONS 预检请求 =====
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' 'http://smart-platform.mxnaturalres.com:9400' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Authorization' always;
            add_header 'Access-Control-Max-Age' '86400' always;
            add_header 'Content-Length' '0' always;
            return 204;
        }
        
        # ===== 保留原有路由逻辑 =====
        try_files $uri $uri/ /index.html;
        
        # ===== 确保非预检请求有 CORS 头 =====
        add_header 'Access-Control-Allow-Origin' 'http://smart-platform.mxnaturalres.com:9400' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Authorization' always;
    }

    # ================== 核心修复：确保所有静态资源都正确添加 CORS 头 ==================
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|woff|woff2|ttf|eot|svg|mp4|webm|avi|mov|otf|map)$ {
        # 关键：添加 always 参数确保所有状态码都返回 CORS 头
        add_header 'Access-Control-Allow-Origin' 'http://smart-platform.mxnaturalres.com:9400' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Authorization' always;
        add_header 'Access-Control-Max-Age' '86400' always;
        
        # ================== 重点：显式处理 OPTIONS 预检请求 ==================
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' 'http://smart-platform.mxnaturalres.com:9400' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Authorization' always;
            add_header 'Access-Control-Max-Age' '86400' always;
            add_header 'Content-Length' '0' always;
            return 204;
        }
        
        # 缓存优化
        expires 30d;
        add_header Cache-Control "public, immutable" always;
        add_header ETag "" always;
    }

     # 文件下载路径
    location /files/ {
        # 使用 alias 而不是 root 来避免路径拼接问题
        alias /usr/share/nginx/html/files/;
        expires 1d;  # 缓存优化
        add_header Cache-Control "public";
        # 允许目录浏览（可选，方便测试）
        autoindex on;
    }

	 # 后端请求代理
    location /apis/ {
      rewrite                ^.+apis/?(.*)$ /$1 break;
     # 设置客户端请求体大小限制，与Spring Boot的max-request-size保持一致
      client_max_body_size 2048M;
      # 如果需要处理大文件上传超时问题，可以添加以下配置（可选）
      proxy_read_timeout 300s;
      proxy_connect_timeout 300s;
      proxy_send_timeout 300s;
      # 禁用请求缓冲，可能有助于大文件上传性能（可选）
      proxy_request_buffering off;
      proxy_pass http://172.31.0.3:8080/;         # 转发到后端服务
	  proxy_set_header Host $host;
	  proxy_set_header X-Real-IP $remote_addr;
	  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
	  proxy_set_header X-Forwarded-Proto $scheme;
	  proxy_set_header X-Forwarded-Host $server_name;
    }


    # 错误页配置
    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }
}
